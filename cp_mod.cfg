// F1-F5: this player's own wall jump assist. Each key changes a client dvar
// that bo7slice.dll relays to the server, so a choice applies only to the
// player who made it. mode: 1 side + frontal, 2 side, 3 frontal, 0 off.
// F4 flips the jump-press requirement (0 auto, 1 double-tap jump at the
// wall): it sets the flag bo7_wjtog and the client script (bo7_wj_watch)
// flips it.
// The dvars are not given a value here. bo7slice.dll restores the last choice
// from the profile folder (bo7_movement_settings.txt) and saves it whenever
// it changes, so it carries over between matches and game launches.
bind F1 "set bo7_mywallmode 1"
bind F2 "set bo7_mywallmode 2"
bind F3 "set bo7_mywallmode 3"
bind F4 "set bo7_wjtog 1"
bind F5 "set bo7_mywallmode 0"
